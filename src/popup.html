<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style type="text/css">
body {
  margin: 0;
  font-family: serif;
  font-size: medium;
  background-color: #fff;
  color: #000;
}
/* We want copy-paste to keep the domain in the first column,
   so this draws a vertical line to fake the "zeroth" column. */
table {
  background-image: url("1x1_808080.png");
  background-position: top 0px left 23px;
  background-repeat: repeat-y;
  --cache-min-width: 0px;
}
table, td, tr {
  border-width: 1px;
  border-collapse: collapse;
  border-color: #808080;
  border-style: solid;
  padding: 0pt 3pt 0pt 3pt;
  white-space: nowrap;
  user-select: none;
}
tr {
  height: 21px;
}
img {
  user-select: none;
}
.mainRow {
  font-weight: bold;
}
.httpImg {
  padding-right: 6pt;
}
.domainTd {
  user-select: text;
  cursor: pointer;
}
.addrTd {
  font-family: monospace;
  border-right-width: 0;
  color: #000080;
  padding-right: 0;
  user-select: text;
  cursor: pointer;
}
.cacheTd {
  border-left-width: 0;
  text-align: right;
  min-width: var(--cache-min-width);
}
.ip4 {
  color: #800000;
}
.ip6 {
  color: #008000;
}
.highlight {
  background-color: #ffff90;
}
.border {
  display: inline-block;
  float: left;
  padding: 6px;
}

.snippedTextInvisible {
  /* When JS removes this style, the snipped text becomes visible. */
  position: absolute;
  overflow: hidden;
  width: 1px;
  color: transparent;
}
.snipLinkInvisible {
  display: none;
}
.snipLinkVisible {
  /* When JS removes this style, the link becomes invisible. */
  display: inline;
}
.snipImg {
  /* Prevent Firefox 'Ctrl-A Ctrl-C' from inserting a line break. */
  user-select: text;
}

#beg {
  display: none;
  margin-bottom: 10px;
  padding: 10px;
  width: 100%
}
#spill_count_container {
  text-align: center;
  font-weight: bold;
  color: #808080;
}
#mobile_footer {
  display: none; /* or flex */
  justify-content: space-between;
  align-items: center;
}
#options_link {
  padding-top: 20px;
  padding-bottom: 20px;
  flex: 1;
  font-size: large;
  text-align: center;
}
#options_link a {
  color: #808080;
}
#pattern_icon_lightfg {
  display: none;
}

/* Utility buttons in the popup row */
.pbtn {
  color: #fafafa;
  background-color: #333;
  text-decoration: none;
  font-family: monospace;
  font-size: 11px;
  line-height: 14px;
  padding: 1px 4px;
  margin-left: 2px;
  font-weight: normal;
  border: 1px solid #555;
  border-radius: 3px;
  cursor: pointer;
  display: inline-block;
  box-sizing: border-box;
  vertical-align: middle;
}
.pbtn:hover {
  opacity: 0.85;
  background-color: #4a4a4a;
}
.pbtn:active {
  opacity: 0.5;
}

/* Footer toolbar */
#footer_bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 6px;
  padding: 4px 2px 2px 2px;
  border-top: 1px solid #e0e0e0;
  font-family: sans-serif;
  font-size: 11px;
}
#copy_all_btn {
  background: #f4f4f4;
  border: 1px solid #bbb;
  border-radius: 3px;
  padding: 2px 8px;
  cursor: pointer;
  font-size: 11px;
  color: #333;
}
#copy_all_btn:hover {
  background: #e8e8e8;
}
#copy_all_btn:active {
  background: #d8d8d8;
}
#footer_options_link a {
  color: #666;
  text-decoration: none;
}
#footer_options_link a:hover {
  text-decoration: underline;
}

/* Copy Toast feedback */
#copy_toast {
  position: fixed;
  bottom: 10px;
  left: 50%;
  transform: translateX(-50%) translateY(25px);
  background: rgba(0, 0, 0, 0.88);
  color: #fff;
  padding: 5px 12px;
  border-radius: 4px;
  font-family: sans-serif;
  font-size: 11px;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.2s ease, transform 0.2s ease;
  z-index: 1000;
  white-space: nowrap;
  box-shadow: 0 2px 8px rgba(0,0,0,0.25);
}
#copy_toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

#lookup_bubble {
  --bubble-fg: #000;
  --bubble-left: 0px;
  --table-left: 0px;
  --table-width: 0px;
  --bubble-width: 0px;
  --max-left: calc(var(--table-left) + var(--table-width) - var(--bubble-width));
  position: absolute;
  display: none;
  background: #eee;
  border: 1px solid var(--bubble-fg);
  border-radius: 5px;
  box-sizing: border-box;
  left: clamp(var(--table-left), var(--bubble-left), var(--max-left));
  max-width: var(--table-width);
}
#lookup_bubble::before {
  /* arrow pointing up from the border. */
  --arrow-size: 5px;
  content: "";
  position: absolute;
  top: calc(-1 * var(--arrow-size));
  left: calc(var(--bubble-left) - min(var(--bubble-left), var(--max-left)) + 10px);
  width: 0;
  height: 0;
  border-left: var(--arrow-size) solid transparent;
  border-right: var(--arrow-size) solid transparent;
  border-bottom: var(--arrow-size) solid var(--bubble-fg);
}
#lookup_bubble a {
  display: block;
  padding: 6pt;
  color: var(--bubble-fg);
  text-decoration: none;
  white-space: nowrap;
  overflow-x: auto;
}

/* dark mode */
@media (prefers-color-scheme: dark) {
  body {
    background-color: #222;
    color: #eee;
  }
  .httpImg {
    filter: invert(1);
  }
  .snipImg {
    filter: invert(1);
  }
  .addrTd {
    color: #8080ff;
  }
  .ip4 {
    color: #ff8080;
  }
  .ip6 {
    color: #80ff80;
  }
  .highlight {
    background-color: #505030;
  }
  #pattern_icon_darkfg {
    display: none;
  }
  #pattern_icon_lightfg {
    display: initial;
  }
  .pbtn {
    background-color: #444;
    color: #eee;
    border-color: #666;
  }
  .pbtn:hover {
    background-color: #555;
  }
  #footer_bar {
    border-top-color: #444;
  }
  #copy_all_btn {
    background: #333;
    border-color: #555;
    color: #ddd;
  }
  #copy_all_btn:hover {
    background: #444;
  }
  #copy_all_btn:active {
    background: #222;
  }
  #footer_options_link a {
    color: #aaa;
  }
  #copy_toast {
    background: rgba(240, 240, 240, 0.95);
    color: #111;
  }
  #lookup_bubble {
    background: #666;
    --bubble-fg: #eee;
  }
}

@keyframes shake {
  from, to {
    transform: translate3d(0, 0, 0);
  }
  20%, 60% {
    transform: translate3d(5px, 0, 0);
  }
  40%, 80% {
    transform: translate3d(-5px, 0, 0);
  }
}
.shake {
  animation-name: shake;
  animation-duration: 500ms;
}

</style>
<script type="text/javascript" src="iputil.js"></script>
<script type="text/javascript" src="common.js"></script>
<script type="text/javascript" src="psl.min.js"></script>
<script type="text/javascript" src="popup.js"></script>
</head>
<body>
<div class="border">
  <button id="beg">Click to grant permission</button>
  <table id="addr_table" height="1px"></table>
  <div id="spill_count_container">
  &#x22ee; <span id="spill_count">0</span> requests omitted
  </div>
  <div id="footer_bar">
    <button id="copy_all_btn" type="button" title="Copy all unique IP addresses">📋 Copy All IPs</button>
    <div id="footer_options_link"><a href="options.html" target="_blank">⚙ Options</a></div>
  </div>
  <div id="mobile_footer">
    <div id="options_link"><a href="options.html">Options</a></div>
    <img id="pattern_icon_lightfg">
    <img id="pattern_icon_darkfg">
  </div>
  <div id="lookup_bubble">
    <a id="lookup_link" href="#" target="_blank">Lookup on lookup.example.com</a>
  </div>
  <div id="copy_toast">Copied to clipboard!</div>
</div>
</body>
</html>
